<!-- HTML FILE -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrics Video Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Lyrics Video Generator</h1>

    <div class="input-section">
      <h2>Upload Audio</h2>
      <div class="file-upload" id="upload-box">
        <input type="file" id="audio-upload" accept="audio/*" />
        <label for="audio-upload">Choose Audio File</label>
      </div>
      <audio id="audio-player" controls></audio>
    </div>

    <div class="input-section lyrics-input">
      <h2>Enter Lyrics</h2>
      <textarea id="lyrics-text" placeholder="Enter lyrics here..."></textarea>
      <div class="lyrics-info">Lyrics will appear over the video canvas.</div>
    </div>

    <div class="font-selection">
      <label for="font-selector">Font Style:</label>
      <select id="font-selector"></select>
    </div>

    <div class="animation-selection">
      <label for="animation-selector">Animation:</label>
      <select id="animation-selector"></select>
    </div>

    <div class="color-selection">
      <label>Text Color:</label>
      <input type="color" id="text-color" value="#ffffff" />
      <label>Background:</label>
      <select id="background-type">
        <option value="black">Black</option>
        <option value="white">White</option>
        <option value="custom">Custom</option>
      </select>
      <input type="color" id="bg-color-picker" value="#000000" style="display: none;" />
    </div>

    <div class="line-duration">
      <label for="line-duration">Line Duration (s):</label>
      <input type="number" id="line-duration" value="3" min="1" />
    </div>

    <div class="control-buttons">
      <button id="generate-btn">Generate Preview</button>
      <button id="download-btn" disabled>Download Video</button>
    </div>

    <div id="preview-container">
      <h2>Preview</h2>
      <div id="video-canvas">
        <div id="lyrics-display"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
